# This is a basic workflow that is manually triggered

name: Fixinator gitChanged Manual workflow

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    # Inputs the workflow accepts.
    inputs:
      fixinator_confidence:
        description: 'The confidence level for fixinator to run at, options are `high`, `medium`, or `low`'
        default: 'high'
        required: true

jobs:
  fixinator:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/foundeo/cfml-ci-tools/cfml-ci-tools:latest
    
    steps:
    - uses: actions/checkout@v4
    - name: Dir Listing
      run: ls -la
    - name: Current Dir
      run: pwd
    - name: Run Fixinator
      run: box fixinator confidence=${{ github.event.inputs.fixinator_confidence }} gitChanged=true
      env:
        FIXINATOR_API_KEY: ${{ secrets.FIXINATOR_API_KEY }}
    
